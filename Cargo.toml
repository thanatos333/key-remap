[package]
name = "key-remap"
version = "0.3.0"
edition = "2021"
description = "One-key input switching on a US keyboard: ` presses the missing Hankaku/Zenkaku (Japanese) or Hangul (Korean) key, and switches to the next input language in any other language. Alt+` types `"
license = "MIT"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
