<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="'Segoe UI','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">
  <rect width="760" height="420" fill="#1a2338"/>
  <text x="40" y="48" font-size="24" fill="#a0afc8">key-remap — one-key IME switching</text>

  <!-- keyboard row -->
  <g>
    <rect x="60" y="90" width="92" height="92" rx="10" fill="#344260" stroke="#5a6e96" stroke-width="2"/>
    <text x="106" y="148" font-size="40" font-weight="bold" fill="#ebf0f8" text-anchor="middle">Esc</text>

    <rect x="164" y="90" width="92" height="92" rx="10" fill="#344260" stroke="#5a6e96" stroke-width="2">
      <animate attributeName="fill" values="#e8590c;#e8590c;#344260;#344260;#e8590c" keyTimes="0;0.24;0.25;0.74;0.75" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <text x="210" y="140" font-size="52" font-weight="bold" fill="#ffffff" text-anchor="middle">`</text>
    <text x="210" y="168" font-size="18" fill="#a0afc8" text-anchor="middle">~</text>

    <rect x="268" y="90" width="92" height="92" rx="10" fill="#344260" stroke="#5a6e96" stroke-width="2"/>
    <text x="314" y="148" font-size="40" font-weight="bold" fill="#ebf0f8" text-anchor="middle">1</text>
    <rect x="372" y="90" width="92" height="92" rx="10" fill="#344260" stroke="#5a6e96" stroke-width="2"/>
    <text x="418" y="148" font-size="40" font-weight="bold" fill="#ebf0f8" text-anchor="middle">2</text>
    <rect x="476" y="90" width="92" height="92" rx="10" fill="#344260" stroke="#5a6e96" stroke-width="2"/>
    <text x="522" y="148" font-size="40" font-weight="bold" fill="#ebf0f8" text-anchor="middle">3</text>

    <rect x="60" y="194" width="140" height="64" rx="10" fill="#344260" stroke="#5a6e96" stroke-width="2">
      <animate attributeName="fill" values="#344260;#344260;#e8590c;#344260;#344260" keyTimes="0;0.49;0.5;0.74;0.75" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <text x="130" y="238" font-size="36" font-weight="bold" fill="#ebf0f8" text-anchor="middle">Alt</text>
  </g>

  <!-- status panel -->
  <rect x="430" y="210" width="290" height="130" rx="12" fill="#232f4a" stroke="#5a6e96" stroke-width="2"/>
  <g font-weight="bold" text-anchor="middle">
    <g opacity="1">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.24;0.25;0.99;1" dur="3.2s" repeatCount="indefinite"/>
      <text x="575" y="252" font-size="24" font-weight="normal" fill="#ffa94d">press `</text>
      <text x="575" y="302" font-size="50" fill="#ebf0f8">あ IME ON</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.25;0.49;0.5;1" dur="3.2s" repeatCount="indefinite"/>
      <text x="575" y="252" font-size="24" font-weight="normal" fill="#ffa94d">press ` again</text>
      <text x="575" y="302" font-size="50" fill="#ebf0f8">A IME OFF</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.5;0.74;0.75;1" dur="3.2s" repeatCount="indefinite"/>
      <text x="575" y="252" font-size="24" font-weight="normal" fill="#ffa94d">Alt + ` types</text>
      <text x="575" y="302" font-size="50" fill="#ebf0f8">`</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.74;0.75;1" dur="3.2s" repeatCount="indefinite"/>
      <text x="575" y="252" font-size="24" font-weight="normal" fill="#ffa94d">Shift + ` types</text>
      <text x="575" y="302" font-size="50" fill="#ebf0f8">~</text>
    </g>
  </g>

  <text x="60" y="312" font-size="24" fill="#ebf0f8">` alone → toggle IME (半角/全角)</text>
  <text x="60" y="348" font-size="24" fill="#ebf0f8">Alt+` → type `&#160;&#160;&#160;&#160;Shift+` → type ~</text>
  <text x="60" y="396" font-size="20" fill="#a0afc8">113 KB · no install · ~1 MB resident · Rust</text>
</svg>
